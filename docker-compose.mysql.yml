services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: local_root_only
      MYSQL_DATABASE: student_information_db
      MYSQL_USER: studentapp
      MYSQL_PASSWORD: local_student_only
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_practicum_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  mysql_practicum_data:
